ass="stagger mx-auto flex max-w-[1180px] flex-col gap-5"><section><p class="eyebrow">providers and keys</p> <h1 class="mt-1 text-xl text-bone">Bring your own model</h1> <p class="mt-2 max-w-[70ch] text-sm leading-relaxed text-bone-dust">A model is optional. Without one NetCast3r still crawls, reads JavaScript, matches 310

      ranks candidates deterministically instead of asking a model. Pick a provider below, paste a
      key, and the connect step saves it, probes the endpoint, and hands you the model list. Every
      enabled provider stays in one pool: the run tries them in priority order and rotates on rate
      limits, so an NVIDIA key and an OpenRouter key work side by side.</p></section> <!> <section class="panel panel-hud p-5"><p class="eyebrow">connect a provider</p> <h2 class="mt-1 text-lg text-bone">Pick one, paste a key, we probe it</h2> <p class="mt-2 max-w-[70ch] text-xs leading-relaxed text-bone-dust">The connect step saves the key into your OS keyring (or a 0600 file under <span class="mono text-acid-dim">~/.netcast3r</span>), creates the provider, calls its <span class="mono">/models</span> endpoint, and shows you what it can reach. Nothing is sent
      anywhere but the provider you picked.</p> <div class="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-4"></div> <!></section> <section class="panel p-5"><div class="flex flex-wrap items-center justify-between gap-3"><div><p class="eyebrow">model pool</p> <h2 class="mt-1 text-lg text-bone">Tried in order, rotated under rate limits</h2></div> <span class="mono text-xs text-ash"> </span></div> <!></section> <section class="grid gap-5 lg:grid-cols-2"><div class="panel p-5"><p class="eyebrow">stored keys</p> <h2 class="mt-1 text-lg text-bone">One machine, one keyring</h2> <p class="mt-2 text-xs leading-relaxed text-bone-dust">Keys go into your operating system keyring when one is available, otherwise a 0600 file
