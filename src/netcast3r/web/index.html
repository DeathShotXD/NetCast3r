ass="stagger mx-auto flex max-w-[1180px] flex-col gap-5"><section><p class="eyebrow">providers and keys</p> <h1 class="mt-1 text-xl text-bone">Bring your own model</h1> <p class="mt-2 max-w-[70ch] text-sm leading-relaxed text-bone-dust">A model is optional. Without one NetCast3r still crawls, reads JavaScript, matches 310
