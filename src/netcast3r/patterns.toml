[[pattern]]
id = "aws_access_key"
type = "aws"
regex = "AKIA[0-9A-Z]{16}"
description = "AWS access key id"

[[pattern]]
id = "aws_secret_key"
type = "aws_secret"
regex = "(?i)aws[_\\-\\s]?secret[_\\-\\s]?(?:access)?[_\\-\\s]?key[\"']?\\s*[:=]\\s*[\"']?([A-Za-z0-9/+=]{40})"
description = "AWS secret access key assigned in code"

[[pattern]]
id = "google_api_key"
type = "google_api"
regex = "AIza[0-9A-Za-z\\-_]{35}"
description = "Google API key"

[[pattern]]
id = "google_oauth"
type = "google_oauth"
regex = "[0-9]+-[0-9A-Za-z_]{32}\\.apps\\.googleusercontent\\.com"
description = "Google OAuth client id"

[[pattern]]
id = "stripe_live"
type = "stripe_live"
regex = "sk_live_[0-9A-Za-z]{24,}"
description = "Stripe live secret key"

[[pattern]]
id = "stripe_test"
type = "stripe_test"
regex = "sk_test_[0-9A-Za-z]{24,}"
description = "Stripe test secret key"

[[pattern]]
id = "slack_token"
type = "slack"
regex = "xox[baprs]-[0-9A-Za-z\\-]{10,}"
description = "Slack token"

[[pattern]]
id = "slack_webhook"
type = "slack_webhook"
regex = "https://hooks\\.slack\\.com/services/T[0-9A-Za-z_]+/B[0-9A-Za-z_]+/[0-9A-Za-z_]+"
description = "Slack incoming webhook"

[[pattern]]
id = "github_token"
type = "github"
regex = "gh[pousr]_[0-9A-Za-z]{36,}"
description = "GitHub token"

[[pattern]]
id = "gitlab_token"
type = "gitlab"
regex = "glpat-[0-9A-Za-z\\-_]{20,}"
description = "GitLab personal access token"

[[pattern]]
id = "sendgrid_key"
type = "sendgrid"
regex = "SG\\.[0-9A-Za-z\\-_]{22}\\.[0-9A-Za-z\\-_]{43}"
description = "SendGrid API key"

[[pattern]]
id = "mapbox_token"
type = "mapbox"
regex = "pk\\.[0-9A-Za-z]{60,}"
description = "Mapbox public token"

[[pattern]]
id = "firebase_url"
type = "firebase"
regex = "https://[a-z0-9\\-]+(?:-default-rtdb)?\\.(?:firebaseio\\.com|firebasedatabase\\.app)"
description = "Firebase database URL"

[[pattern]]
id = "private_key"
type = "private_key"
regex = "-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----"
description = "Private key block"

[[pattern]]
id = "jwt"
type = "jwt"
regex = "eyJ[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}"
description = "JSON Web Token"

[[pattern]]
id = "generic_assignment"
type = "generic"
regex = "(?i)(?:api[_\\-]?key|apikey|secret|token|password|passwd|access[_\\-]?key)\\s*[:=]\\s*[\"'](?=[A-Za-z0-9\\-_./+=]*[0-9])[A-Za-z0-9\\-_./+=]{16,64}[\"']"
description = "Generic secret assigned to a variable"
entropy = 3.5

[[pattern]]
id = "openai_key"
type = "openai"
regex = "sk-(?:proj-)?[A-Za-z0-9]{40,}"
description = "OpenAI API key"

[[pattern]]
id = "anthropic_key"
type = "anthropic"
regex = "sk-ant-[A-Za-z0-9_\\-]{40,}"
description = "Anthropic API key"

[[pattern]]
id = "groq_key"
type = "groq"
regex = "gsk_[A-Za-z0-9]{40,}"
description = "Groq API key"

[[pattern]]
id = "huggingface_token"
type = "huggingface"
regex = "hf_[A-Za-z0-9]{30,}"
description = "Hugging Face token"

[[pattern]]
id = "digitalocean_token"
type = "digitalocean"
regex = "dop_v1_[a-f0-9]{64}"
description = "DigitalOcean personal access token"

[[pattern]]
id = "npm_token"
type = "npm"
regex = "npm_[A-Za-z0-9]{36}"
description = "npm access token"

[[pattern]]
id = "postman_key"
type = "postman"
regex = "PMAK-[a-f0-9]{24}-[a-f0-9]{34}"
description = "Postman API key"

[[pattern]]
id = "shopify_token"
type = "shopify"
regex = "shpat_[a-f0-9]{32}"
description = "Shopify admin access token"

[[pattern]]
id = "google_oauth_secret"
type = "google_oauth_secret"
regex = "GOCSPX-[A-Za-z0-9_\\-]{28}"
description = "Google OAuth client secret"

[[pattern]]
id = "telegram_bot_token"
type = "telegram"
regex = "(?:api\\.telegram\\.org/bot|[Tt]elegram[^0-9\\n]{0,24})([0-9]{8,10}:[A-Za-z0-9_\\-]{35})"
group = 1
description = "Telegram bot token"

[[pattern]]
id = "discord_webhook"
type = "discord_webhook"
regex = "https://(?:discord|discordapp)\\.com/api/webhooks/[0-9]+/[A-Za-z0-9_\\-]+"
description = "Discord webhook URL"

[[pattern]]
id = "sentry_dsn"
type = "sentry_dsn"
regex = "https://[0-9a-f]{32}@o[0-9]+\\.ingest\\.sentry\\.io/[0-9]+"
description = "Sentry DSN"

[[pattern]]
id = "mapbox_secret"
type = "mapbox_secret"
regex = "sk\\.[A-Za-z0-9._\\-]{60,}"
description = "Mapbox secret token"

[[pattern]]
id = "db_connection"
type = "db_connection"
regex = "(?:postgres(?:ql)?|mysql|mongodb(?:\\+srv)?|redis|amqp|mssql)://[A-Za-z0-9._%\\-]+:[^\\s\"'<>@]{6,}@[^\\s\"'<>]{4,}"
description = "Database connection string with credentials"

[[pattern]]
id = "mailgun_key"
type = "mailgun"
regex = "key-[0-9a-zA-Z]{32}"
description = "Mailgun API key"

[[pattern]]
id = "mailchimp_key"
type = "mailchimp"
regex = "[0-9a-f]{32}-us[0-9]{1,2}"
description = "Mailchimp API key"

[[pattern]]
id = "contentful_token"
type = "contentful"
regex = "CFPAT-[A-Za-z0-9_\\-]{20,}"
description = "Contentful management token"

[[pattern]]
id = "twilio_sid"
type = "twilio"
regex = "SK[0-9a-fA-F]{32}"
description = "Twilio API key SID"

[[pattern]]
id = "nvidia_key"
type = "nvidia"
regex = "nvapi-[A-Za-z0-9_\\-]{30,}"
description = "NVIDIA API key"

[[pattern]]
id = "facebook_token"
type = "facebook"
regex = "EAACEdEose0cBA[0-9A-Za-z]+"
description = "Facebook access token"
