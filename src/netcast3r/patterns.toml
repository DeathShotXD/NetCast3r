regex = "(?i)[\\w.-]{0,50}?(?:yandex)(?:[ \\t\\w.-]{0,20})[\\s'\"]{0,3}(?:=|>|:{1,3}=|\\|\\||:|=>|\\?=|,)[\\x60'\"\\s=]{0,5}(YC[a-zA-Z0-9_\\-]{38})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"
description = "Uncovered a Yandex AWS Access Token, potentially compromising cloud resource access and data security on Yandex Cloud."
keywords = ["yandex"]

[[pattern]]
id = "zendesk_secret_key"
type = "zendesk_secret_key"
regex = "(?i)[\\w.-]{0,50}?(?:zendesk)(?:[ \\t\\w.-]{0,20})[\\s'\"]{0,3}(?:=|>|:{1,3}=|\\|\\||:|=>|\\?=|,)[\\x60'\"\\s=]{0,5}([a-z0-9]{40})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"
description = "Detected a Zendesk Secret Key, risking unauthorized access to customer support services and sensitive ticketing data."
keywords = ["zendesk"]

[[pattern]]
id = "openrouter_key"
type = "openrouter"
regex = "sk-or-v1-[a-f0-9]{64}"
description = "OpenRouter API key"

[[pattern]]
id = "discord_webhook"
type = "discord_webhook"
regex = "https://(?:discord|discordapp)\\.com/api/webhooks/[0-9]+/[A-Za-z0-9_\\-]+"
description = "Discord webhook URL"

[[pattern]]
id = "db_connection"
type = "db_connection"
regex = "(?:postgres(?:ql)?|mysql|mongodb(?:\\+srv)?|redis|amqp|mssql)://[A-Za-z0-9._%\\-]+:[^\\s\\\"'<>@]{6,}@[^\\s\\\"'<>]{4,}"
description = "Database connection string with credentials"

[[pattern]]
id = "firebase_url"
type = "firebase"
regex = "https://[a-z0-9\\-]+(?:-default-rtdb)?\\.(?:firebaseio\\.com|firebasedatabase\\.app)"
description = "Firebase realtime database URL"

[[pattern]]
id = "mapbox_secret"
type = "mapbox_secret"
regex = "sk\\.[A-Za-z0-9._\\-]{60,}"
description = "Mapbox secret token"

[[pattern]]
id = "sentry_dsn"
type = "sentry_dsn"
regex = "https://[0-9a-f]{32}@o[0-9]+\\.ingest\\.sentry\\.io/[0-9]+"
description = "Sentry DSN"

[[pattern]]
id = "generic_assignment"
type = "generic"
regex = "(?i)(?:api[_\\-]?key|apikey|secret|token|password|passwd|access[_\\-]?key)\\s*[:=]\\s*[\\\"'](?=[A-Za-z0-9\\-_./+=]*[0-9])[A-Za-z0-9\\-_./+=]{16,64}[\\\"']"
description = "Generic secret assigned to a variable"
entropy = 3.5

[[pattern]]
id = "shodan_api_key"
type = "shodan"
regex = "(?i)shodan[^A-Za-z0-9]{0,24}([A-Za-z0-9]{32})"
description = "Shodan API key"
group = 1
keywords = ["shodan"]

[[pattern]]
id = "groq_key"
type = "groq"
regex = "gsk_[A-Za-z0-9]{40,}"
description = "Groq API key"
keywords = ["gsk_"]

[[pattern]]
id = "private_key_header"
type = "private_key"
regex = "-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP |ENCRYPTED )?PRIVATE KEY-----"
description = "Private key header"
keywords = ["-----begin"]
