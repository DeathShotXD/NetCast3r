[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcast3r"
version = "0.1.0"
description = "Cast a net over the web: crawl a target, read its JavaScript, hunt 230 secret patterns, validate credentials against 26 provider recipes, and write a report you can submit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "0xDeathShotX_X" }]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]
dev = ["pytest>=8.0"]

[project.scripts]
netcast3r = "netcast3r.cli:main"

[project.urls]
Homepage = "https://github.com/DeathShotXD"
Repository = "https://github.com/DeathShotXD/NetCast3r"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netcast3r = ["*.toml", "dashboard/*.html", "dashboard/*.webp"]
