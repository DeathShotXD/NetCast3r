<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-label="Recon, exegete, prospector, assayer, chainer, scribe">
  <defs>
    <marker id="parw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8A33D"/>
    </marker>
    <pattern id="pgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8A33D" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <filter id="pglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="180" rx="10" fill="#0D1117"/>
  <rect x="0" y="0" width="960" height="180" rx="10" fill="url(#pgrid)"/>
  <rect x="0.5" y="0.5" width="959" height="179" rx="10" fill="none" stroke="#2A333F"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <g>
      <rect x="40" y="40" width="128" height="60" rx="8" fill="#161B22" stroke="#E8A33D" stroke-width="1.5"/>
      <text x="104" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#E8A33D">RECON</text>
      <text x="104" y="84" text-anchor="middle" font-size="11" fill="#C9D1D9">crawl</text>
    </g>
    <g>
      <rect x="190" y="40" width="128" height="60" rx="8" fill="#161B22" stroke="#E8A33D" stroke-width="1.5"/>
      <text x="254" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#E8A33D">EXEGETE</text>
      <text x="254" y="84" text-anchor="middle" font-size="11" fill="#C9D1D9">read js</text>
    </g>
    <g>
      <rect x="340" y="40" width="128" height="60" rx="8" fill="#161B22" stroke="#E8A33D" stroke-width="1.5"/>
      <text x="404" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#E8A33D">PROSPECTOR</text>
      <text x="404" y="84" text-anchor="middle" font-size="11" fill="#C9D1D9">hunt</text>
    </g>
    <g>
      <rect x="490" y="40" width="128" height="60" rx="8" fill="#161B22" stroke="#E8A33D" stroke-width="1.5"/>
      <text x="554" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#E8A33D">ASSAYER</text>
      <text x="554" y="84" text-anchor="middle" font-size="11" fill="#C9D1D9">validate</text>
    </g>
    <g>
      <rect x="640" y="40" width="128" height="60" rx="8" fill="#161B22" stroke="#E8A33D" stroke-width="1.5"/>
      <text x="704" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#E8A33D">CHAINER</text>
      <text x="704" y="84" text-anchor="middle" font-size="11" fill="#C9D1D9">escalate</text>
    </g>
    <g>
      <rect x="790" y="40" width="128" height="60" rx="8" fill="#161B22" stroke="#E8A33D" stroke-width="1.5"/>
      <text x="854" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#E8A33D" filter="url(#pglow)">SCRIBE</text>
      <text x="854" y="84" text-anchor="middle" font-size="11" fill="#C9D1D9">report</text>
    </g>

    <line x1="170" y1="70" x2="188" y2="70" stroke="#E8A33D" stroke-width="2" marker-end="url(#parw)" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="320" y1="70" x2="338" y2="70" stroke="#E8A33D" stroke-width="2" marker-end="url(#parw)" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="470" y1="70" x2="488" y2="70" stroke="#E8A33D" stroke-width="2" marker-end="url(#parw)" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="620" y1="70" x2="638" y2="70" stroke="#E8A33D" stroke-width="2" marker-end="url(#parw)" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="770" y1="70" x2="788" y2="70" stroke="#E8A33D" stroke-width="2" marker-end="url(#parw)" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.7s" repeatCount="indefinite"/>
    </line>

    <circle r="3" cy="70" fill="#E8A33D" filter="url(#pglow)">
      <animate attributeName="cx" values="170;186" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" cy="70" fill="#E8A33D" filter="url(#pglow)">
      <animate attributeName="cx" values="470;486" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
    </circle>

    <text x="480" y="140" text-anchor="middle" font-size="12" fill="#5B6675">one anonymous crawl -&gt; the swarm reads, hunts, validates, escalates, and reports</text>
  </g>
</svg>
