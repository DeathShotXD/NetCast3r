<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-label="Six stage rail: crawl, read JavaScript, hunt, validate, escalate, report, driven by the recon, exegete, prospector, assayer, chainer and scribe agents.">
  <defs>
    <pattern id="pgrid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#9F23DD" stroke-width="1" opacity=".12"/>
    </pattern>
    <clipPath id="pclip"><rect x="2" y="17" width="956" height="196" rx="14"/></clipPath>
    <filter id="aglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .ic{fill:none;stroke:#C8F81A;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .chv{fill:none;stroke:#C8F81A;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.5;animation:pulse 1.6s ease-in-out infinite}
      .c1{animation-delay:0s}.c2{animation-delay:.14s}.c3{animation-delay:.28s}.c4{animation-delay:.42s}.c5{animation-delay:.56s}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .dot{animation:run 5.5s linear infinite}
      @keyframes run{from{transform:translateX(0)}to{transform:translateX(840px)}}
      @media (prefers-reduced-motion:reduce){.chv{animation:none;opacity:.85}.dot{animation:none;opacity:0}}
    ]]></style>
  </defs>

  <rect x=".8" y="16.8" width="958.4" height="198.4" rx="14" fill="#05030A" stroke="#C8F81A" stroke-width="1.6"/>
  <g clip-path="url(#pclip)"><rect x="0" y="16" width="960" height="200" fill="url(#pgrid)" opacity=".55"/></g>

  <g fill="none" stroke="#C8F81A" stroke-width="1.6" stroke-linecap="square">
    <path d="M14 38V26h12"/>
    <path d="M946 38V26h-12"/>
    <path d="M14 194v12h12"/>
    <path d="M946 194v12h-12"/>
  </g>
  <path d="M858 34h70" stroke="#9F23DD" stroke-width="3" stroke-linecap="round" opacity=".9"/>

  <g class="m" text-anchor="middle">
    <g transform="translate(114,60)"><g class="ic"><circle r="13"/><path d="M-13 0h26"/><ellipse rx="6.5" ry="13"/></g></g>
    <g transform="translate(260,60)"><g class="ic"><path d="M-6 -8L-15 0l9 8"/><path d="M6 -8L15 0l-9 8"/><path d="M3 -10L-3 10"/></g></g>
    <g transform="translate(406,60)"><g class="ic"><circle cx="-3" cy="-3" r="9"/><path d="M4 4l9 9"/></g></g>
    <g transform="translate(552,60)"><g class="ic"><path d="M0 -13l11 5v8c0 6-11 11-11 11S-11 6-11 0v-8z"/><path d="M-4 0l3 4 6-7"/></g></g>
    <g transform="translate(698,60)"><g class="ic"><path d="M-9 1L0 -7l9 8"/><path d="M-9 10L0 2l9 8"/></g></g>
    <g transform="translate(844,60)"><g class="ic"><rect x="-9" y="-13" width="18" height="26" rx="2"/><path d="M-4 -6h8M-4 0h8M-4 6h5"/></g></g>
  </g>

  <g class="chv" fill="none">
    <path class="c1" d="M182 53l7 7-7 7"/>
    <path class="c2" d="M328 53l7 7-7 7"/>
    <path class="c3" d="M474 53l7 7-7 7"/>
    <path class="c4" d="M620 53l7 7-7 7"/>
    <path class="c5" d="M766 53l7 7-7 7"/>
  </g>

  <g class="m" text-anchor="middle">
    <g font-size="14.5" font-weight="700" letter-spacing="1.4" fill="#F5E9DC">
      <text x="114" y="110">CRAWL</text>
      <text x="260" y="110">READ JS</text>
      <text x="406" y="110">HUNT</text>
      <text x="552" y="110">VALIDATE</text>
      <text x="698" y="110">ESCALATE</text>
      <text x="844" y="110">REPORT</text>
    </g>
    <g font-size="10" fill="#A89591">
      <text x="114" y="128">Target &amp; Endpoints</text>
      <text x="260" y="128">Map Logic &amp; Weak Spots</text>
      <text x="406" y="128">Secrets &amp; Credentials</text>
      <text x="552" y="128">Check Access &amp; Impact</text>
      <text x="698" y="128">Find Highest Provable</text>
      <text x="844" y="128">Ready for Submission</text>
    </g>
    <g>
      <rect x="68" y="141" width="92" height="21" rx="3" fill="#160334" stroke="#4C2377"/>
      <rect x="214" y="141" width="92" height="21" rx="3" fill="#160334" stroke="#4C2377"/>
      <rect x="360" y="141" width="92" height="21" rx="3" fill="#160334" stroke="#4C2377"/>
      <rect x="506" y="141" width="92" height="21" rx="3" fill="#160334" stroke="#4C2377"/>
      <rect x="652" y="141" width="92" height="21" rx="3" fill="#160334" stroke="#4C2377"/>
      <rect x="798" y="141" width="92" height="21" rx="3" fill="#160334" stroke="#4C2377"/>
    </g>
    <g font-size="11" fill="#FDF7E8">
      <text x="114" y="156"><tspan fill="#C8F81A" font-weight="700">&gt;</tspan> recon</text>
      <text x="260" y="156"><tspan fill="#C8F81A" font-weight="700">&gt;</tspan> exegete</text>
      <text x="406" y="156"><tspan fill="#C8F81A" font-weight="700">&gt;</tspan> prospector</text>
      <text x="552" y="156"><tspan fill="#C8F81A" font-weight="700">&gt;</tspan> assayer</text>
      <text x="698" y="156"><tspan fill="#C8F81A" font-weight="700">&gt;</tspan> chainer</text>
      <text x="844" y="156"><tspan fill="#C8F81A" font-weight="700">&gt;</tspan> scribe</text>
    </g>
  </g>

  <path d="M60 180H900" stroke="#172603" stroke-width="2.4" stroke-linecap="round"/>
  <g class="dot" filter="url(#aglow)"><circle cx="60" cy="180" r="3.6" fill="#C8F81A"/></g>

  <text class="m" x="480" y="201" font-size="10.5" letter-spacing=".4" text-anchor="middle" fill="#A89591">one anonymous crawl -&gt; the swarm reads, hunts, validates, escalates, and reports</text>
</svg>
