<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" role="img" aria-label="Live feed of a run scrolling like tail -f: recon crawls and logs each status, the exegete parses bundles, the prospector surfaces four candidates, the assayer checks a stripe key, an AWS key is confirmed live, and the scribe writes the report.">
  <defs>
    <pattern id="stgrid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#9F23DD" stroke-width="1" opacity=".11"/>
    </pattern>
    <pattern id="stscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect y="0" width="4" height="1" fill="#000" opacity=".45"/>
    </pattern>
    <clipPath id="stclip"><rect x="1" y="1" width="958" height="148" rx="6"/></clipPath>
    <clipPath id="stwin"><rect x="40" y="48" width="880" height="92"/></clipPath>
    <linearGradient id="stft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030A"/>
      <stop offset="1" stop-color="#05030A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stfb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030A" stop-opacity="0"/>
      <stop offset="1" stop-color="#05030A"/>
    </linearGradient>
    <filter id="stgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".04"/></feComponentTransfer>
    </filter>
    <style><![CDATA[
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .col{animation:scrl 27.6s linear infinite}
      @keyframes scrl{from{transform:translateY(0)}to{transform:translateY(-276px)}}
      .bk{animation:bk 1.1s steps(1) infinite}
      @keyframes bk{0%,55%{opacity:1}56%,100%{opacity:0}}
      .lvd{animation:lv 1.6s ease-in-out infinite}
      @keyframes lv{0%,100%{opacity:1}50%{opacity:.25}}
      @media (prefers-reduced-motion:reduce){.col{animation:none}.bk{animation:none}.lvd{animation:none}}
    ]]></style>
  </defs>

  <rect x=".5" y=".5" width="959" height="149" rx="6" fill="#05030A" stroke="#170F3F"/>
  <g clip-path="url(#stclip)">
    <rect width="960" height="150" fill="url(#stgrid)" opacity=".5"/>
    <rect x="40" y="48" width="880" height="92" fill="#07040D" opacity=".6"/>
    <g clip-path="url(#stwin)">
