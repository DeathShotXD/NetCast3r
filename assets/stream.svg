  <g class="m">
    <circle class="lv" cx="880" cy="23" r="3" fill="#C8F81A"/>
    <text x="890" y="27" font-size="10" font-weight="700" letter-spacing="2" fill="#C8F81A">LIVE</text>
  </g>
</svg>
