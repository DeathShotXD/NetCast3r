<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Caught credentials panel: AWS secret access key confirmed, database URL corroborated, API key inferred, client secret unresolved, with a report checklist and the four validation states.">
  <defs>
    <pattern id="kgrid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#9F23DD" stroke-width="1" opacity=".11"/>
    </pattern>
    <clipPath id="kclip"><rect x="1" y="1" width="958" height="428" rx="6"/></clipPath>
    <filter id="kglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .card{fill:#0A0614;stroke:#4C2377;stroke-width:1.2}
      .tick{fill:none;stroke:#C8F81A;stroke-width:1.4;stroke-linecap:square}
      .ck{fill:none;stroke:#C8F81A;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s ease-out forwards}
      .k1{animation-delay:.25s}.k2{animation-delay:.4s}.k3{animation-delay:.55s}.k4{animation-delay:.7s}
      @keyframes draw{to{stroke-dashoffset:0}}
      .np{animation:np 2.4s ease-in-out infinite}
      @keyframes np{0%,100%{r:3;opacity:1}50%{r:5;opacity:.75}}
      .float{animation:fl 6s ease-in-out infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce){.ck{animation:none;stroke-dashoffset:0}.np{animation:none}.float{animation:none}}
    ]]></style>
  </defs>

  <rect x=".5" y=".5" width="959" height="429" rx="6" fill="#05030A" stroke="#170F3F"/>
  <g clip-path="url(#kclip)"><rect width="960" height="430" fill="url(#kgrid)" opacity=".5"/></g>

  <g fill="none" stroke="#C8F81A" stroke-width="1.6" stroke-linecap="square">
    <path d="M9 21V9h12"/>
    <path d="M951 21V9h-12"/>
    <path d="M9 409v12h12"/>
    <path d="M951 409v12h-12"/>
  </g>
  <path d="M872 26h62" stroke="#9F23DD" stroke-width="3" stroke-linecap="round" opacity=".9"/>

  <g class="m">
    <text x="32" y="40" font-size="15" font-weight="700" letter-spacing="1.6" fill="#F5E9DC">CAUGHT</text>
    <text x="126" y="40" font-size="12" letter-spacing=".8" fill="#C8F81A">// MASKED CREDENTIALS</text>
    <text x="928" y="40" font-size="12" font-weight="700" letter-spacing="1" text-anchor="end" fill="#C8F81A">4 CAUGHT</text>
  </g>
  <path d="M32 54H928" stroke="#241640" stroke-width="1"/>

  <g class="m">
    <g transform="translate(32,70)">
      <rect class="card" x="0" y="0" width="262" height="104" rx="6"/>
      <path class="tick" d="M8 18V8h10"/>
      <rect x="14" y="30" width="44" height="44" rx="6" fill="#160334" stroke="#6CA52E"/>
      <g transform="translate(36,52)" fill="none" stroke="#C8F81A" stroke-width="1.8" stroke-linecap="round">
        <circle cx="-5" cy="-2" r="5.5"/><path d="M0 2h13M9 2v5M13 2v4"/>
      </g>
      <text x="70" y="34" font-size="11.5" font-weight="700" letter-spacing=".5" fill="#F5E9DC">AWS_SECRET_ACCESS_KEY</text>
      <text x="70" y="56" font-size="11.5" fill="#C8F81A">wJalrX...EKEY</text>
      <rect x="70" y="68" width="88" height="20" rx="3" fill="#160334" stroke="#C8F81A"/>
      <text x="114" y="82" font-size="9.5" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#C8F81A">CONFIRMED</text>
    </g>

    <g transform="translate(310,70)">
      <rect class="card" x="0" y="0" width="262" height="104" rx="6"/>
      <path class="tick" d="M8 18V8h10"/>
      <rect x="14" y="30" width="44" height="44" rx="6" fill="#160334" stroke="#6CA52E"/>
      <g transform="translate(36,52)" fill="none" stroke="#C8F81A" stroke-width="1.8">
        <ellipse cx="0" cy="-7" rx="10" ry="4"/>
        <path d="M-10 -7v14c0 2.2 4.5 4 10 4s10-1.8 10-4v-14"/>
        <path d="M-10 0c0 2.2 4.5 4 10 4s10-1.8 10-4"/>
      </g>
      <text x="70" y="34" font-size="11.5" font-weight="700" letter-spacing=".5" fill="#F5E9DC">DATABASE_URL</text>
      <text x="70" y="56" font-size="11.5" fill="#C8F81A">postgres://user:pass@...</text>
      <rect x="70" y="68" width="122" height="20" rx="3" fill="#160334" stroke="#EFE4B1"/>
      <text x="131" y="82" font-size="9.5" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#EFE4B1">CORROBORATED</text>
    </g>

    <g transform="translate(32,190)">
      <rect class="card" x="0" y="0" width="262" height="104" rx="6"/>
      <path class="tick" d="M8 18V8h10"/>
      <rect x="14" y="30" width="44" height="44" rx="6" fill="#160334" stroke="#6CA52E"/>
      <g transform="translate(36,52)" fill="#C8F81A">
        <circle cx="-5" cy="0" r="6"/><circle cx="3" cy="-4" r="7.5"/><circle cx="9" cy="1" r="5"/>
        <rect x="-5" y="1" width="14" height="5" rx="2.5"/>
      </g>
      <text x="70" y="34" font-size="11.5" font-weight="700" letter-spacing=".5" fill="#F5E9DC">API_KEY</text>
      <text x="70" y="56" font-size="11.5" fill="#C8F81A">sk_live_...</text>
      <rect x="70" y="68" width="84" height="20" rx="3" fill="#160334" stroke="#9F23DD"/>
      <text x="112" y="82" font-size="9.5" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#9F23DD">INFERRED</text>
    </g>

    <g transform="translate(310,190)">
      <rect class="card" x="0" y="0" width="262" height="104" rx="6"/>
      <path class="tick" d="M8 18V8h10"/>
      <rect x="14" y="30" width="44" height="44" rx="6" fill="#160334" stroke="#6CA52E"/>
      <g transform="translate(36,52)" fill="none" stroke="#C8F81A" stroke-width="1.8">
        <rect x="-11" y="-8" width="22" height="16" rx="2.5"/>
        <rect x="-11" y="-3" width="22" height="4" fill="#C8F81A" stroke="none"/>
      </g>
      <text x="70" y="34" font-size="11.5" font-weight="700" letter-spacing=".5" fill="#F5E9DC">CLIENT_SECRET</text>
      <text x="70" y="56" font-size="11.5" fill="#C8F81A">********</text>
      <rect x="70" y="68" width="96" height="20" rx="3" fill="#160334" stroke="#9698A2"/>
      <text x="118" y="82" font-size="9.5" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#9698A2">UNRESOLVED</text>
    </g>
  </g>

  <g stroke-linecap="round" fill="none">
    <path d="M50 388L94 344 134 400 174 334 212 378 252 338 292 392" stroke="#C8F81A" stroke-width="1.2" opacity=".55"/>
    <path d="M50 388L118 368 94 344M118 368L134 400M118 368L174 334M118 368L212 378M134 400L196 406 212 378M174 334L252 338M212 378L270 368 252 338M270 368L292 392M196 406L270 368" stroke="#9F23DD" stroke-width="1.1" opacity=".5"/>
    <g fill="#010101" stroke="#C8F81A" stroke-width="1.4">
      <circle cx="50" cy="388" r="3"/><circle cx="134" cy="400" r="3"/><circle cx="174" cy="334" r="3"/>
      <circle cx="252" cy="338" r="3"/><circle cx="292" cy="392" r="3"/><circle cx="118" cy="368" r="3"/>
      <circle cx="196" cy="406" r="3"/><circle cx="270" cy="368" r="3"/>
    </g>
    <circle class="np" cx="94" cy="344" r="3" fill="#C8F81A" filter="url(#kglow)"/>
    <circle cx="212" cy="378" r="3.4" fill="#C8F81A" filter="url(#kglow)"/>
  </g>

  <g class="m">
    <text x="330" y="346" font-size="11.5" fill="#A89591">// masked before the report is written</text>
    <text x="330" y="372" font-size="11.5" fill="#A89591">validation runs first, proof comes after</text>
  </g>

  <g class="float">
    <rect x="620" y="70" width="308" height="176" rx="6" fill="#07040D" stroke="#C8F81A" stroke-width="1.4"/>
    <path d="M628 88V78h10M920 88V78h-10" fill="none" stroke="#C8F81A" stroke-width="1.4"/>
    <g class="m">
      <text x="638" y="100" font-size="14" font-weight="700" letter-spacing="1.6" fill="#F5E9DC">REPORT</text>
      <g transform="translate(896,88)" fill="none" stroke="#C8F81A" stroke-width="1.6">
        <rect x="-9" y="-11" width="18" height="22" rx="2"/>
        <path d="M-4 -5h8M-4 0h8M-4 5h5" stroke-linecap="round"/>
      </g>
      <path d="M638 114H910" stroke="#241640" stroke-width="1"/>
      <g font-size="12.5" fill="#F5E9DC">
        <path class="ck k1" d="M640 136l4 5 8-10"/>
        <text x="666" y="140">PoC</text>
        <path class="ck k2" d="M640 162l4 5 8-10"/>
        <text x="666" y="166">Evidence</text>
        <path class="ck k3" d="M640 188l4 5 8-10"/>
        <text x="666" y="192">Steps to Reproduce</text>
        <path class="ck k4" d="M640 214l4 5 8-10"/>
        <text x="666" y="218" fill="#C8F81A" font-weight="700">Submission Ready</text>
      </g>
    </g>
  </g>

  <g class="m" font-size="10.5" font-weight="700" letter-spacing="1.2">
    <rect x="620" y="266" width="308" height="24" rx="3" fill="#0A0614" stroke="#C8F81A"/>
    <text x="636" y="282" fill="#F5E9DC">CONFIRMED</text>
    <text x="912" y="282" text-anchor="end" fill="#C8F81A">1</text>

    <rect x="620" y="298" width="308" height="24" rx="3" fill="#0A0614" stroke="#EFE4B1"/>
    <text x="636" y="314" fill="#F5E9DC">CORROBORATED</text>
    <text x="912" y="314" text-anchor="end" fill="#EFE4B1">1</text>

    <rect x="620" y="330" width="308" height="24" rx="3" fill="#0A0614" stroke="#9F23DD"/>
    <text x="636" y="346" fill="#F5E9DC">INFERRED</text>
    <text x="912" y="346" text-anchor="end" fill="#9F23DD">1</text>

    <rect x="620" y="362" width="308" height="24" rx="3" fill="#0A0614" stroke="#9698A2"/>
    <text x="636" y="378" fill="#F5E9DC">UNRESOLVED</text>
    <text x="912" y="378" text-anchor="end" fill="#9698A2">1</text>
  </g>
</svg>
