<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Animated terminal window running an example netcast3r scan: recon reports 42 pages and 61 javascript files, the exegete reads them, the prospector finds 4 candidates, the assayer plans a read only check, an AWS key comes back confirmed and a database URL corroborated, and scribe writes report.md and dashboard.html.">
  <defs>
    <pattern id="tgrid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#9F23DD" stroke-width="1" opacity=".1"/>
    </pattern>
    <clipPath id="tclip"><rect x="1" y="1" width="958" height="438" rx="6"/></clipPath>
    <style><![CDATA[
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .type{animation:type 1.15s steps(48,end) .1s both}
      @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
      .bk{animation:bk 1.05s steps(1,end) infinite}
      @keyframes bk{0%,50%{opacity:1}51%,100%{opacity:0}}
      .ln{opacity:0;animation:in .38s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.type{animation:none}.ln{opacity:1;animation:none;transform:none}.bk{animation:none}}
    ]]></style>
  </defs>

  <rect x=".5" y=".5" width="959" height="439" rx="6" fill="#05030A" stroke="#170F3F"/>
  <g clip-path="url(#tclip)"><rect width="960" height="440" fill="url(#tgrid)" opacity=".5"/></g>

  <g fill="none" stroke="#C8F81A" stroke-width="1.6" stroke-linecap="square">
    <path d="M9 21V9h12"/>
    <path d="M951 21V9h12"/>
    <path d="M9 419v12h12"/>
    <path d="M951 419v12h12"/>
  </g>
  <path d="M872 26h62" stroke="#9F23DD" stroke-width="3" stroke-linecap="round" opacity=".9"/>

  <g class="m">
    <text x="32" y="40" font-size="14" font-weight="700" letter-spacing="1.6" fill="#F5E9DC">NETCAST3R</text>
    <text x="152" y="40" font-size="12" letter-spacing=".8" fill="#C8F81A">// EXAMPLE RUN</text>
    <text x="928" y="40" font-size="11.5" letter-spacing="1" text-anchor="end" fill="#A89591">shell</text>
    <path d="M32 54H928" stroke="#241640" stroke-width="1"/>
  </g>

  <text class="m type" x="32" y="82" font-size="13.5" letter-spacing=".2" fill="#F5E9DC"><tspan fill="#C8F81A" font-weight="700">$</tspan> netcast3r run --input target.com --scope scope.txt --html<tspan class="bk" fill="#C8F81A">_</tspan></text>

  <g class="m ln" style="animation-delay:.62s">
    <text x="32" y="110" font-size="13" letter-spacing=".3" fill="#C8F81A" font-weight="700">NETCAST3R<tspan fill="#9F23DD">  &gt;  </tspan><tspan fill="#A89591">target=</tspan><tspan fill="#F5E9DC">target.com</tspan></text>
    <path d="M32 128H928" stroke="#241640" stroke-width="1"/>
  </g>

  <g class="m ln" style="animation-delay:.78s" font-size="13" letter-spacing=".2">
    <text x="32" y="156" fill="#C8F81A" font-weight="700">[recon]</text>
    <text x="160" y="156" fill="#F5E9DC">42 pages, 61 js files, 128 endpoints</text>
  </g>
  <g class="m ln" style="animation-delay:.9s" font-size="13" letter-spacing=".2">
    <text x="32" y="178" fill="#C8F81A" font-weight="700">[recon]</text>
    <text x="160" y="178" fill="#F5E9DC">7 historical js files from the wayback machine</text>
  </g>
  <g class="m ln" style="animation-delay:1.02s" font-size="13" letter-spacing=".2">
    <text x="32" y="200" fill="#C8F81A" font-weight="700">[exegete]</text>
    <text x="160" y="200" fill="#F5E9DC">reading 61 files</text>
  </g>
  <g class="m ln" style="animation-delay:1.14s" font-size="13" letter-spacing=".2">
    <text x="32" y="222" fill="#C8F81A" font-weight="700">[prospector]</text>
    <text x="160" y="222" fill="#F5E9DC">4 candidates</text>
  </g>
  <g class="m ln" style="animation-delay:1.26s" font-size="13" letter-spacing=".2">
    <text x="32" y="244" fill="#C8F81A" font-weight="700">[assayer]</text>
    <text x="160" y="244" fill="#F5E9DC">planned a read only check for aws_secret_access_key</text>
  </g>
  <g class="m ln" style="animation-delay:1.4s" font-size="13" letter-spacing=".2">
    <text x="32" y="266" fill="#C8F81A" font-weight="700">[confirmed]</text>
    <text x="160" y="266" fill="#F5E9DC">aws_secret_access_key</text>
    <text x="340" y="266" fill="#C8F81A">wJalrX...EKEY</text>
    <text x="470" y="266" fill="#A89591">live</text>
  </g>
  <g class="m ln" style="animation-delay:1.52s" font-size="13" letter-spacing=".2">
    <text x="32" y="288" fill="#EFE4B1" font-weight="700">[corroborated]</text>
    <text x="160" y="288" fill="#F5E9DC">database_url</text>
    <text x="340" y="288" fill="#C8F81A">postgres://us...@db</text>
  </g>
  <g class="m ln" style="animation-delay:1.64s" font-size="13" letter-spacing=".2">
    <text x="32" y="310" fill="#C8F81A" font-weight="700">[scribe]</text>
    <text x="160" y="310" fill="#F5E9DC">report written to results/report.md</text>
  </g>
  <g class="m ln" style="animation-delay:1.76s" font-size="13" letter-spacing=".2">
    <text x="32" y="332" fill="#C8F81A" font-weight="700">[scribe]</text>
    <text x="160" y="332" fill="#F5E9DC">dashboard written to results/dashboard.html</text>
  </g>

  <g class="m ln" style="animation-delay:1.9s">
    <text x="32" y="364" font-size="14" font-weight="700" letter-spacing="1.6" fill="#F5E9DC">SUMMARY</text>
    <path d="M32 380H928" stroke="#241640" stroke-width="1"/>
    <g font-size="13" letter-spacing=".2">
      <text x="40" y="404" fill="#A89591">endpoints</text>
      <text x="144" y="404" fill="#C8F81A" font-weight="700">128</text>
      <text x="340" y="404" fill="#A89591">javascript</text>
      <text x="444" y="404" fill="#C8F81A" font-weight="700">61</text>
      <text x="640" y="404" fill="#A89591">candidates</text>
      <text x="744" y="404" fill="#C8F81A" font-weight="700">4</text>
      <text x="40" y="424" fill="#A89591">confirmed</text>
      <text x="144" y="424" fill="#C8F81A" font-weight="700">1</text>
      <text x="340" y="424" fill="#A89591">corroborated</text>
      <text x="444" y="424" fill="#C8F81A" font-weight="700">1</text>
      <text x="640" y="424" fill="#A89591">report</text>
      <text x="744" y="424" fill="#F5E9DC">results/report.md</text>
    </g>
  </g>
</svg>
