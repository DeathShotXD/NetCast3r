<svg xmlns="http://www.w3.org/2000/svg" width="960" height="54" viewBox="0 0 960 54" role="img" aria-label="Net divider">
  <defs>
    <pattern id="dgrid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#9F23DD" stroke-width="1" opacity=".1"/>
    </pattern>
    <clipPath id="dclip"><rect x="1" y="1" width="958" height="52" rx="6"/></clipPath>
    <filter id="dsp" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .sp{animation:sp 4.6s linear infinite}
      @keyframes sp{from{transform:translateX(14px)}to{transform:translateX(932px)}}
      .pn{animation:pn 3s ease-in-out infinite}
      @keyframes pn{0%,100%{opacity:1}50%{opacity:.45}}
      @media (prefers-reduced-motion:reduce){.sp{animation:none;opacity:0}.pn{animation:none}}
    ]]></style>
  </defs>

  <rect x=".5" y=".5" width="959" height="53" rx="6" fill="#05030A" stroke="#170F3F"/>
  <g clip-path="url(#dclip)">
    <rect width="960" height="54" fill="url(#dgrid)" opacity=".5"/>

    <g fill="none" stroke-linecap="round">
      <path d="M14 40L134 26 254 36 374 18 494 32 614 16 734 34 854 24 946 38" stroke="#C8F81A" stroke-width="1.3" opacity=".62"/>
      <path d="M14 18L134 32 254 14 374 30 494 12 614 28 734 14 854 32 946 16" stroke="#9F23DD" stroke-width="1.2" opacity=".5"/>
      <path d="M134 26V32M254 36V14M374 18V30M494 32V12M614 16V28M734 34V14M854 24V32" stroke="#C8F81A" stroke-width="1" opacity=".38"/>
    </g>

    <g fill="#010101" stroke="#C8F81A" stroke-width="1.3">
      <circle cx="134" cy="26" r="2.8"/><circle cx="254" cy="36" r="2.8"/>
      <circle cx="374" cy="18" r="2.8"/><circle cx="614" cy="16" r="2.8"/>
      <circle cx="734" cy="34" r="2.8"/><circle cx="854" cy="24" r="2.8"/>
    </g>
    <circle class="pn" cx="494" cy="22" r="4" fill="#C8F81A" filter="url(#dsp)"/>
    <circle cx="14" cy="40" r="2.4" fill="#9F23DD"/>
    <circle cx="946" cy="16" r="2.4" fill="#9F23DD"/>
  </g>

  <g class="sp" filter="url(#dsp)"><circle cx="0" cy="27" r="3.2" fill="#C8F81A"/></g>
</svg>
