<svg xmlns="http://www.w3.org/2000/svg" width="960" height="64" viewBox="0 0 960 64" role="img" aria-label="A pulse of signal travelling along a wire between two connectors; relay nodes light up and ping as it passes, with ruler tick marks beneath.">
  <defs>
    <pattern id="nagrid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#9F23DD" stroke-width="1" opacity=".11"/>
    </pattern>
    <clipPath id="naclip"><rect x="1" y="1" width="958" height="62" rx="6"/></clipPath>
    <linearGradient id="dtail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8F81A" stop-opacity="0"/>
      <stop offset="1" stop-color="#C8F81A" stop-opacity=".85"/>
    </linearGradient>
    <filter id="dglow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .pkg{animation:pkgx 7.0s linear infinite,pkgf 7.0s linear infinite}
      @keyframes pkgx{from{transform:translateX(42px)}to{transform:translateX(924px)}}
      @keyframes pkgf{0%{opacity:0}1.5%{opacity:1}96%{opacity:1}98%,100%{opacity:0}}
      .trl{stroke-dashoffset:1;opacity:0;animation:trlx 7.0s linear infinite,trlo 7.0s linear infinite}
      @keyframes trlx{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
      @keyframes trlo{0%{opacity:0}1.5%{opacity:.38}96%{opacity:.38}98%,100%{opacity:0}}
      .rlit{opacity:0;animation:rlacq 7.0s linear infinite}
      @keyframes rlacq{0%,5.5%{opacity:0}8%,30%{opacity:1}36%,100%{opacity:0}}
      .pn{animation:pnacq 7.0s linear infinite}
      @keyframes pnacq{0%,5.5%{r:3;opacity:0}7%{opacity:.85}30%{r:13;opacity:0}100%{r:13;opacity:0}}
      .pl{animation:plpin 7.0s linear infinite}
      @keyframes plpin{0%{opacity:.8}1.5%,3%{opacity:1}5%,100%{opacity:.8}}
      .pr{animation:prpin 7.0s linear infinite}
      @keyframes prpin{0%,92%{opacity:.8}95%,96.5%{opacity:1}98%,100%{opacity:.8}}
      @media (prefers-reduced-motion:reduce){
        .pkg{display:none}
        .trl{animation:none;stroke-dashoffset:0;opacity:.38}
        .rlit{animation:none;opacity:1}
        .pn{animation:none;opacity:0}
        .pl,.pr{animation:none}
      }
    ]]></style>
  </defs>

  <rect x=".5" y=".5" width="959" height="63" rx="6" fill="#05030A" stroke="#170F3F"/>
  <g clip-path="url(#naclip)">
    <rect width="960" height="64" fill="url(#nagrid)" opacity=".5"/>

    <g fill="none" stroke="#C8F81A" stroke-width="1" opacity=".4">
      <path d="M10 20V10h10"/>
      <path d="M940 10h10v10"/>
      <path d="M10 44v10h10"/>
      <path d="M950 54v-10h-10"/>
    </g>

    <path d="M44 34H916" stroke="#9F23DD" stroke-width="1" opacity=".16"/>
    <path d="M44 32H916" stroke="#C8F81A" stroke-width="1" opacity=".12"/>
    <path d="M44 33H916" stroke="#241640" stroke-width="1"/>
    <path d="MM100 35V41M120 35V38M140 35V38M160 35V38M180 35V38M200 35V41M220 35V38M240 35V38M260 35V38M280 35V38M300 35V41M320 35V38M340 35V38M360 35V38M380 35V38M400 35V41M420 35V38M440 35V38M460 35V38M480 35V38M500 35V41M520 35V38M540 35V38M560 35V38M580 35V38M600 35V41M620 35V38M640 35V38M660 35V38M680 35V38M700 35V41M720 35V38M740 35V38M760 35V38M780 35V38M800 35V41M820 35V38M840 35V38M860 35V38" stroke="#4C2377" stroke-width="1" opacity=".6"/>

    <path class="trl" d="M42 33H924" pathLength="1" fill="none" stroke="#C8F81A" stroke-width="1.3"/>

    <rect x="30" y="24" width="12" height="18" rx="2" fill="#07040D" stroke="#4C2377" stroke-width="1"/>
    <path class="pl" d="M36 28.5V37.5" stroke="#C8F81A" stroke-width="1.4" opacity=".8"/>
    <rect x="918" y="24" width="12" height="18" rx="2" fill="#07040D" stroke="#4C2377" stroke-width="1"/>
    <path class="pr" d="M924 28.5V37.5" stroke="#C8F81A" stroke-width="1.4" opacity=".8"/>

        <path d="M260 28l5 5-5 5-5-5z" stroke="#4C2377" fill="#0A0614" stroke-width="1.1"/>
    <path class="rlit" d="M260 28l5 5-5 5-5-5z" stroke="#C8F81A" fill="#160334" stroke-width="1.1" style="animation-delay:-5.69s"/>
    <circle class="pn" cx="260" cy="33" r="3" fill="none" stroke="#C8F81A" stroke-width="1" style="animation-delay:-5.69s"/>    <path d="M480 28l5 5-5 5-5-5z" stroke="#4C2377" fill="#0A0614" stroke-width="1.1"/>
    <path class="rlit" d="M480 28l5 5-5 5-5-5z" stroke="#C8F81A" fill="#160334" stroke-width="1.1" style="animation-delay:-3.94s"/>
    <circle class="pn" cx="480" cy="33" r="3" fill="none" stroke="#C8F81A" stroke-width="1" style="animation-delay:-3.94s"/>    <path d="M700 28l5 5-5 5-5-5z" stroke="#4C2377" fill="#0A0614" stroke-width="1.1"/>
    <path class="rlit" d="M700 28l5 5-5 5-5-5z" stroke="#C8F81A" fill="#160334" stroke-width="1.1" style="animation-delay:-2.20s"/>
    <circle class="pn" cx="700" cy="33" r="3" fill="none" stroke="#C8F81A" stroke-width="1" style="animation-delay:-2.20s"/>

    <g class="pkg">
      <rect x="-32" y="32" width="30" height="2" fill="url(#dtail)"/>
      <path d="M0 24V42" stroke="#C8F81A" stroke-width="1.2" opacity=".85"/>
      <circle cx="0" cy="33" r="2.6" fill="#F5F87D" filter="url(#dglow)"/>
    </g>
  </g>
</svg>
