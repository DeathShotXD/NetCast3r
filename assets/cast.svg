<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-label="A single sweep moving across a field of targets. As it passes each artifact locks on and lights up: a host, two JavaScript bundles, a config, an API route, a source map, an env file, a stripe key, and the report.">
  <defs>
    <pattern id="nagrid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#9F23DD" stroke-width="1" opacity=".11"/>
    </pattern>
    <clipPath id="naclip"><rect x="1" y="1" width="958" height="178" rx="6"/></clipPath>
    <linearGradient id="nabcol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8F81A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C8F81A" stop-opacity=".12"/>
      <stop offset="1" stop-color="#C8F81A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nabv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8F81A" stop-opacity="0"/>
      <stop offset=".25" stop-color="#C8F81A" stop-opacity=".9"/>
      <stop offset=".75" stop-color="#C8F81A" stop-opacity=".9"/>
      <stop offset="1" stop-color="#C8F81A" stop-opacity="0"/>
    </linearGradient>
    <filter id="naglow" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .beam{animation:bm 9.0s linear infinite, bmfade 9.0s linear infinite}
      @keyframes bm{from{transform:translateX(36px)}to{transform:translateX(924px)}}
      @keyframes bmfade{0%,2%{opacity:0}4%{opacity:1}96%{opacity:1}98%,100%{opacity:0}}
      .trail{animation:tl 9.0s linear infinite, tlfade 9.0s linear infinite}
      @keyframes tl{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
      @keyframes tlfade{0%,2%{opacity:0}4%{opacity:.28}96%{opacity:.28}98%,100%{opacity:0}}
      .nd{animation:ndacq 9.0s linear infinite}
      @keyframes ndacq{0%,5.5%{stroke:#4C2377;fill:#0A0614}7%,13%{stroke:#C8F81A;fill:#160334}15.5%,100%{stroke:#4C2377;fill:#0A0614}}
      .bk{animation:bkacq 9.0s linear infinite}
      @keyframes bkacq{0%,5%{stroke-dashoffset:12;opacity:0}6.5%,13%{stroke-dashoffset:0;opacity:1}13.1%,100%{stroke-dashoffset:12;opacity:0}}
      .lb{animation:lbacq 9.0s linear infinite}
      @keyframes lbacq{0%,5.5%{fill:#A89591}7%,13%{fill:#F5E9DC}15.5%,100%{fill:#A89591}}
      .tg{animation:tgacq 9.0s linear infinite}
      @keyframes tgacq{0%,5.5%{fill:#A89591;opacity:.45}7%,13%{fill:#C8F81A;opacity:1}15.5%,100%{fill:#A89591;opacity:.45}}
      .pn{animation:pnacq 9.0s linear infinite}
      @keyframes pnacq{0%,5.5%{r:3;opacity:0}6.5%{opacity:.85}13%{r:15;opacity:0}100%{r:15;opacity:0}}
      @media (prefers-reduced-motion:reduce){.beam{animation:none;opacity:0}.trail{animation:none;stroke-dashoffset:0;opacity:.28}.nd{animation:none;stroke:#C8F81A;fill:#160334}.bk{animation:none;stroke-dashoffset:0;opacity:1}.lb{animation:none;fill:#F5E9DC}.tg{animation:none;fill:#C8F81A;opacity:1}.pn{animation:none;opacity:0}}
    ]]></style>
  </defs>

  <rect x=".5" y=".5" width="959" height="179" rx="6" fill="#05030A" stroke="#170F3F"/>
  <g clip-path="url(#naclip)"><rect width="960" height="180" fill="url(#nagrid)" opacity=".5"/></g>

  <g fill="none" stroke="#C8F81A" stroke-width="1.6" stroke-linecap="square">
