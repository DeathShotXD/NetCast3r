<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="A radar sweep across a target field. As the sweep passes each bearing a blip locks on, a matching line lights up in the live endpoint log beside it, and the yield meters fill: 121 hosts, 61 bundles, 128 routes, 4 candidates. A stripe key reads live.">
  <defs>
    <pattern id="nagrid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#9F23DD" stroke-width="1" opacity=".11"/>
    </pattern>
    <pattern id="nascan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect y="0" width="4" height="1" fill="#000" opacity=".45"/>
    </pattern>
    <clipPath id="naclip"><rect x="1" y="1" width="958" height="238" rx="6"/></clipPath>
    <linearGradient id="wgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8F81A" stop-opacity="0"/>
      <stop offset="1" stop-color="#C8F81A" stop-opacity=".28"/>
    </linearGradient>
    <radialGradient id="navig" gradientUnits="userSpaceOnUse" cx="480" cy="136" r="560">
      <stop offset=".55" stop-color="#05030A" stop-opacity="0"/>
      <stop offset="1" stop-color="#05030A" stop-opacity=".5"/>
    </radialGradient>
    <filter id="nagrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
    <filter id="hg" x="-5%" y="-40%" width="110%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.002 0.55" numOctaves="1" seed="8" result="bands"/>
      <feDisplacementMap in="SourceGraphic" in2="bands" xChannelSelector="R" yChannelSelector="G" scale="0">
        <animate attributeName="scale" values="0;0;2.5;0;0;1.5;0" keyTimes="0;0.45;0.5;0.53;0.7;0.74;0.77" calcMode="discrete" dur="6.4s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
    <style><![CDATA[
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .wgd{animation:spin 8.0s linear infinite;transform-origin:150px 144px;transform-box:view-box}
      @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      .gv{animation:gflk 7.3s steps(1) infinite;opacity:0}
      .ga{animation:gflk 7.3s steps(1) infinite;opacity:0;animation-delay:-3.9s}
      @keyframes gflk{0%,69%{opacity:0}70%,72.5%{opacity:.8}73%,86%{opacity:0}87%,88.5%{opacity:.55}89%,100%{opacity:0}}
      .gm{animation:gmflk 7.3s steps(1) infinite;opacity:0}
      @keyframes gmflk{0%,46%{opacity:0}47%,47.6%{opacity:.85}48%,71%{opacity:0}72%,72.5%{opacity:.7}73%,100%{opacity:0}}
      .bl{animation:blacq 8.0s linear infinite}
      @keyframes blacq{0%,5.5%{fill:#9F23DD;opacity:.35}8%,30%{fill:#C8F81A;opacity:1}36%,100%{fill:#9F23DD;opacity:.35}}
      .pn{animation:pnacq 8.0s linear infinite}
      @keyframes pnacq{0%,5.5%{r:3;opacity:0}7%{opacity:.85}30%{r:13;opacity:0}100%{r:13;opacity:0}}
      .rg{animation:rgacq 8.0s linear infinite}
      @keyframes rgacq{0%,5.5%{stroke:#4C2377;fill:#0A0614}8%,30%{stroke:#C8F81A;fill:#160334}36%,100%{stroke:#4C2377;fill:#0A0614}}
      .rl{animation:rlacq 8.0s linear infinite}
      @keyframes rlacq{0%,5.5%{fill:#A89591}8%,30%{fill:#F5E9DC}36%,100%{fill:#A89591}}
      .rt{animation:rtacq 8.0s linear infinite}
      @keyframes rtacq{0%,5.5%{fill:#4C2377}8%,30%{fill:#9F23DD}36%,100%{fill:#4C2377}}
      .rs{animation:rsacq 8.0s linear infinite}
      @keyframes rsacq{0%,5.5%{fill:#A89591;opacity:.45}8%,30%{fill:#C8F81A;opacity:1}36%,100%{fill:#A89591;opacity:.45}}
      .rb{opacity:0;animation:rbacq 8.0s linear infinite}
      @keyframes rbacq{0%,5.5%{opacity:0}8%,30%{opacity:.06}36%,100%{opacity:0}}
      .ra{opacity:0;animation:raacq 8.0s linear infinite}
      @keyframes raacq{0%,5.5%{opacity:0}8%,30%{opacity:1}36%,100%{opacity:0}}
      .bf{transform:scaleX(0);transform-box:fill-box;transform-origin:left;animation:bargrow 8.0s linear infinite}
      @keyframes bargrow{0%{transform:scaleX(0)}12%{transform:scaleX(1)}88%{transform:scaleX(1);opacity:1}92%{transform:scaleX(1);opacity:0}94%{transform:scaleX(0);opacity:0}100%{transform:scaleX(0);opacity:0}}
      .lvd{animation:lv 1.6s ease-in-out infinite}
      @keyframes lv{0%,100%{opacity:1}50%{opacity:.25}}
      @media (prefers-reduced-motion:reduce){
        .wgd{animation:none;opacity:0}.gv,.ga,.gm{animation:none;opacity:0}
        .bl{animation:none;fill:#C8F81A;opacity:1}.pn{animation:none;opacity:0}
        .rg{animation:none;stroke:#C8F81A;fill:#160334}.rl{animation:none;fill:#F5E9DC}
        .rt{animation:none;fill:#9F23DD}.rs{animation:none;fill:#C8F81A;opacity:1}
        .rb{animation:none;opacity:.06}.ra{animation:none;opacity:1}
        .bf{animation:none;transform:scaleX(1)}.lvd{animation:none}
      }
    ]]></style>
  </defs>

