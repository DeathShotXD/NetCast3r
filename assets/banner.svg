<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="NetCast3r, cast a net over the web">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111823"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.3" fill="#C9D1D9" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#scan)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" fill="none" stroke="#2A333F" stroke-width="1"/>

  <g stroke="#3A4750" fill="none" opacity="0.6">
    <polygon points="1130,130 1095,215 1010,250 925,215 890,130 925,45 1010,10 1095,45"/>
    <polygon points="1090,130 1067,187 1010,210 953,187 930,130 953,73 1010,50 1067,73"/>
    <polygon points="1050,130 1038,158 1010,170 982,158 970,130 982,102 1010,90 1038,102"/>
    <line x1="1010" y1="130" x2="1130" y2="130"/>
    <line x1="1010" y1="130" x2="1095" y2="215"/>
    <line x1="1010" y1="130" x2="1010" y2="250"/>
    <line x1="1010" y1="130" x2="925" y2="215"/>
    <line x1="1010" y1="130" x2="890" y2="130"/>
    <line x1="1010" y1="130" x2="925" y2="45"/>
    <line x1="1010" y1="130" x2="1010" y2="10"/>
    <line x1="1010" y1="130" x2="1095" y2="45"/>
  </g>
  <g stroke="#E8A33D" stroke-width="1.4" fill="none" opacity="0.9" filter="url(#glow)">
    <line x1="1010" y1="130" x2="1130" y2="130">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="1010" y1="130" x2="925" y2="215">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="1010" y1="130" x2="1010" y2="10">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <g fill="#E8A33D">
    <ellipse cx="1010" cy="132" rx="6" ry="9"/>
    <circle cx="1010" cy="120" r="4.5"/>
  </g>
  <g stroke="#E8A33D" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M1005 128 L985 118"/>
    <path d="M1005 134 L985 140"/>
    <path d="M1008 140 L995 156"/>
    <path d="M1012 140 L1025 156"/>
    <path d="M1015 134 L1035 140"/>
    <path d="M1015 128 L1035 118"/>
    <path d="M1008 124 L995 108"/>
    <path d="M1012 124 L1025 108"/>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#7C8794">
    <text x="1098" y="86">api_key</text>
    <text x="900" y="200">sk_live</text>
    <text x="1046" y="238">token</text>
  </g>

  <text x="70" y="132" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="78" font-weight="bold" fill="#E8A33D" filter="url(#glow)">NetCast3r</text>
  <text x="74" y="176" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#C9D1D9">cast a net over the web</text>
  <text x="74" y="212" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#5B6675">crawl . read javascript . hunt secrets . validate . escalate . report</text>
</svg>
