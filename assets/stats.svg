<svg xmlns="http://www.w3.org/2000/svg" width="960" height="54" viewBox="0 0 960 54" role="img" aria-label="Automated web recon, JavaScript analysis, secret hunting, validation and reporting. 310 patterns, 135 validation recipes.">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8F81A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C8F81A" stop-opacity=".14"/>
      <stop offset="1" stop-color="#C8F81A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#9F23DD" stroke-width="1" opacity=".13"/>
    </pattern>
    <clipPath id="sclip"><rect x="1" y="1" width="958" height="52" rx="6"/></clipPath>
    <style><![CDATA[
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .sw{animation:sw 5s linear infinite}
      @keyframes sw{from{transform:translateX(-190px)}to{transform:translateX(1010px)}}
      .bk{animation:bk 1.1s steps(1,end) infinite}
      @keyframes bk{0%,50%{opacity:1}51%,100%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.sw{animation:none;opacity:0}.bk{animation:none}}
    ]]></style>
  </defs>

  <rect x=".5" y=".5" width="959" height="53" rx="6" fill="#07040D" stroke="#170F3F"/>
  <g clip-path="url(#sclip)">
    <rect width="960" height="54" fill="url(#grid)" opacity=".55"/>
    <rect class="sw" x="-190" y="0" width="150" height="54" fill="url(#sheen)"/>
  </g>

  <g fill="none" stroke="#C8F81A" stroke-width="1.6" stroke-linecap="square">
    <path d="M9 21V9h12"/>
    <path d="M951 21V9h-12"/>
    <path d="M9 33v12h12"/>
    <path d="M951 33v12h-12"/>
  </g>

  <rect x="16" y="11" width="32" height="32" rx="5" fill="#160334" stroke="#C8F81A" stroke-width="1.4"/>
  <text class="m" x="32" y="34" font-size="15" font-weight="700" fill="#C8F81A" text-anchor="middle">&gt;<tspan class="bk">_</tspan></text>

  <text class="m" x="64" y="33" font-size="12.5" letter-spacing=".8" fill="#F5E9DC">AUTOMATED WEB RECON<tspan fill="#9F23DD"> / </tspan>JS ANALYSIS<tspan fill="#9F23DD"> / </tspan>SECRET HUNTING<tspan fill="#9F23DD"> / </tspan>VALIDATION<tspan fill="#9F23DD"> / </tspan>REPORTING</text>

  <text class="m" x="938" y="33" font-size="11.5" letter-spacing=".5" font-weight="700" text-anchor="end" fill="#C8F81A">310 PATTERNS<tspan fill="#9F23DD">  //  </tspan>135 RECIPES</text>
</svg>
