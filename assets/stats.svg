<svg xmlns="http://www.w3.org/2000/svg" width="960" height="64" viewBox="0 0 960 64" role="img" aria-label="crawl, read js, hunt secrets, validate, escalate, report">
  <defs>
    <linearGradient id="ssheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D1D9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C9D1D9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C9D1D9" stop-opacity="0"/>
    </linearGradient>
    <filter id="sglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="64" rx="10" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="959" height="63" rx="10" fill="none" stroke="#2A333F"/>
  <circle cx="34" cy="32" r="5" fill="#E8A33D" filter="url(#sglow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="38" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#C9D1D9">
    <tspan fill="#E8A33D" font-weight="bold">CRAWL</tspan>
    <tspan fill="#4A5568">  |  </tspan>READ JS
    <tspan fill="#4A5568">  |  </tspan><tspan fill="#E8A33D">HUNT SECRETS</tspan>
    <tspan fill="#4A5568">  |  </tspan>VALIDATE
    <tspan fill="#4A5568">  |  </tspan><tspan fill="#E8A33D">ESCALATE</tspan>
    <tspan fill="#4A5568">  |  </tspan>REPORT
  </text>
  <rect x="-160" y="0" width="140" height="64" fill="url(#ssheen)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1120 0" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
