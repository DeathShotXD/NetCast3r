<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="NetCast3r monogram">
  <defs>
    <pattern id="lgrid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#9F23DD" stroke-width="1" opacity=".16"/>
    </pattern>
    <clipPath id="lclip"><rect x="1" y="1" width="318" height="318" rx="28"/></clipPath>
    <linearGradient id="lshine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8F81A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C8F81A" stop-opacity=".16"/>
      <stop offset="1" stop-color="#C8F81A" stop-opacity="0"/>
    </linearGradient>
    <filter id="lg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .d{font-family:"Arial Black","Arial Bold",Arial,"Helvetica Neue",sans-serif;font-weight:900}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .sw{animation:sw 4.5s linear infinite}
      @keyframes sw{from{transform:translateX(-90px)}to{transform:translateX(360px)}}
      @media (prefers-reduced-motion:reduce){.sw{animation:none;opacity:0}}
    ]]></style>
  </defs>

  <rect x=".5" y=".5" width="319" height="319" rx="28" fill="#010101" stroke="#4C2377" stroke-width="1.4"/>
  <g clip-path="url(#lclip)">
    <rect width="320" height="320" fill="url(#lgrid)"/>
    <rect class="sw" x="-90" y="0" width="70" height="320" fill="url(#lshine)"/>

    <g stroke="#9F23DD" stroke-width="7" stroke-linecap="round" opacity=".5">
      <path d="M24 250l44-44"/>
      <path d="M44 274l52-52"/>
      <path d="M262 74l40-40"/>
      <path d="M246 58l34-34"/>
    </g>
    <g stroke="#C8F81A" stroke-width="3.4" stroke-linecap="round" opacity=".65">
      <path d="M30 96l30-30"/>
      <path d="M262 244l34-34"/>
      <path d="M284 262l24-24"/>
    </g>
  </g>

  <g>
    <polygon points="160,52 244,101 244,199 160,248 76,199 76,101" fill="#160334" stroke="#C8F81A" stroke-width="2.2"/>
    <polygon points="160,74 225,112 225,188 160,226 95,188 95,112" fill="none" stroke="#9F23DD" stroke-width="1.4" opacity=".85"/>
    <g filter="url(#lg)">
      <text class="d" x="166" y="196" font-size="104" text-anchor="middle" fill="#9F23DD">N</text>
      <text class="d" x="158" y="190" font-size="104" text-anchor="middle" fill="#C8F81A">N</text>
    </g>
  </g>

  <g class="m" text-anchor="middle">
    <text x="160" y="284" font-size="19" font-weight="700" letter-spacing="5" fill="#F5E9DC">NETCAST3R</text>
    <text x="160" y="304" font-size="9.5" letter-spacing="2.4" fill="#A89591">&gt; BUG BOUNTY AUTOMATION</text>
  </g>
</svg>
